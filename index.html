<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Darts Scorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="setup-screen">
    <h2>🎯 Lichfield Arrers - 1st to 25</h2>
    
    <div style="display: flex; justify-content: space-around; width: 98%; margin: 0 auto; font-size: 0.8rem; font-weight: bold; color: #aaa; padding-bottom: 5px;">
        <span style="width: 45px; text-align: center;">Order</span>
        <span style="width: 85px; text-align: left;">Name</span>
        <span style="width: 50px; text-align: center;">Handicap</span>
        <span style="width: 35px; text-align: center;">Legs</span>
        <span style="width: 40px; text-align: center;">High CO</span>
        <span style="width: 45px; text-align: center;">3-Avg</span>
    </div>

    <!-- ROW 1 -->
    <div class="input-row" style="display: flex; justify-content: space-around; align-items: center; margin-bottom: 8px;">
        <select id="pos1" onchange="swapPlayerPosition(1, this.value)" style="width: 45px; font-weight: bold;">
            <option value="1" selected>1st</option>
            <option value="2">2nd</option>
            <option value="3">3rd</option>
            <option value="4">4th</option>
        </select>
        <input type="text" id="n1" value="Dreamboy" onchange="saveSetupToStorage()" style="width: 85px;">
        <input type="number" id="s1" value="401" onchange="saveSetupToStorage()" style="width: 50px;">
        <input type="number" id="l1" value="8" onchange="saveSetupToStorage()" style="width: 35px; text-align: center;">
        <span id="co1" style="width: 40px; text-align: center; font-weight: bold; color: #00e676;">-</span>
        <span id="avg1" style="width: 45px; text-align: center; font-weight: bold; color: #00e676;">0.00</span>
    </div>

    <!-- ROW 2 -->
    <div class="input-row" style="display: flex; justify-content: space-around; align-items: center; margin-bottom: 8px;">
        <select id="pos2" onchange="swapPlayerPosition(2, this.value)" style="width: 45px; font-weight: bold;">
            <option value="1">1st</option>
            <option value="2" selected>2nd</option>
            <option value="3">3rd</option>
            <option value="4">4th</option>
        </select>
        <input type="text" id="n2" value="Keith Deller" onchange="saveSetupToStorage()" style="width: 85px;">
        <input type="number" id="s2" value="411" onchange="saveSetupToStorage()" style="width: 50px;">
        <input type="number" id="l2" value="17" onchange="saveSetupToStorage()" style="width: 35px; text-align: center;">
        <span id="co2" style="width: 40px; text-align: center; font-weight: bold; color: #00e676;">-</span>
        <span id="avg2" style="width: 45px; text-align: center; font-weight: bold; color: #00e676;">0.00</span>
    </div>

    <!-- ROW 3 -->
    <div class="input-row" style="display: flex; justify-content: space-around; align-items: center; margin-bottom: 8px;">
        <select id="pos3" onchange="swapPlayerPosition(3, this.value)" style="width: 45px; font-weight: bold;">
            <option value="1">1st</option>
            <option value="2">2nd</option>
            <option value="3" selected>3rd</option>
            <option value="4">4th</option>
        </select>
        <input type="text" id="n3" value="Wetfoot" onchange="saveSetupToStorage()" style="width: 85px;">
        <input type="number" id="s3" value="271" onchange="saveSetupToStorage()" style="width: 50px;">
        <input type="number" id="l3" value="9" onchange="saveSetupToStorage()" style="width: 35px; text-align: center;">
        <span id="co3" style="width: 40px; text-align: center; font-weight: bold; color: #00e676;">-</span>
        <span id="avg3" style="width: 45px; text-align: center; font-weight: bold; color: #00e676;">0.00</span>
    </div>

    <!-- ROW 4 -->
    <div class="input-row" style="display: flex; justify-content: space-around; align-items: center; margin-bottom: 8px;">
        <select id="pos4" onchange="swapPlayerPosition(4, this.value)" style="width: 45px; font-weight: bold;">
            <option value="1">1st</option>
            <option value="2">2nd</option>
            <option value="3">3rd</option>
            <option value="4" selected>4th</option>
        </select>
        <input type="text" id="n4" value="Limparm" onchange="saveSetupToStorage()" style="width: 85px;">
        <input type="number" id="s4" value="251" onchange="saveSetupToStorage()" style="width: 50px;">
        <input type="number" id="l4" value="12" onchange="saveSetupToStorage()" style="width: 35px; text-align: center;">
        <span id="co4" style="width: 40px; text-align: center; font-weight: bold; color: #00e676;">-</span>
        <span id="avg4" style="width: 45px; text-align: center; font-weight: bold; color: #00e676;">0.00</span>
    </div>

    <div style="display: flex; gap: 10px; width: 92%; margin: 15px auto 0 auto;">
        <button class="btn-go" onclick="launchGame()" style="flex: 2;">NEW LEG</button>
        <button onclick="saveSessionHistory()" style="flex: 1; background: #0288d1; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">SAVE SESSION</button>
    </div>
</div>

<div id="game-screen" style="display:none">
<div id="scoreboard"></div>
<div id="preview">0</div>
<div class="numpad">
<button onclick="addNum(1)">1</button><button onclick="addNum(2)">2</button><button onclick="addNum(3)">3</button>
<button onclick="addNum(4)">4</button><button onclick="addNum(5)">5</button><button onclick="addNum(6)">6</button>
<button onclick="addNum(7)">7</button><button onclick="addNum(8)">8</button><button onclick="addNum(9)">9</button>
<button style="background:#c62828" onclick="doUndo()">UNDO</button><button onclick="addNum(0)">0</button>
<button class="btn-enter" onclick="submit()">ENTER</button>
</div>
<div id="checkout-suggestion" style="
    text-align: center; 
    margin-top: 20px; 
    font-size: 3rem; 
    font-weight: bold; 
    color: #00ff00; 
    text-shadow: 2px 2px #000;
    min-height: 3.5rem;">
</div>

</div>

<!-- LEG SUMMARY POP-UP MODAL -->
<div id="win-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; justify-content:center; align-items:center;">
    <div style="background:#222; padding:25px; border-radius:15px; text-align:center; border:2px solid #2e7d32; width:85%; max-width:450px; color:white;">
        <h1 id="win-message" style="color:#4caf50; margin-top:0; font-size:1.8rem;"></h1>
        
        <div style="background: #111; border: 1px solid #444; border-radius: 10px; padding: 15px; text-align: left; font-size: 1.1rem; margin: 20px 0;">
            <h3 style="text-align: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 0; color: #aaa; font-size: 1rem;">LEG BREAKDOWN</h3>
            <p style="display:flex; justify-content:space-between; margin: 10px 0;"><span>Winner:</span> <strong id="summary-winner" style="color:#4caf50;">-</strong></p>
            <p style="display:flex; justify-content:space-between; margin: 10px 0;"><span>Winning Checkout:</span> <strong id="summary-checkout">-</strong></p>
            <p style="display:flex; justify-content:space-between; margin: 10px 0;"><span>Darts Thrown:</span> <strong id="summary-darts">-</strong></p>
            <p style="display:flex; justify-content:space-between; margin: 10px 0;"><span>Leg Avg (Scoring):</span> <strong id="summary-avg">-</strong></p>
        </div>

        <button onclick="closeWinModal()" style="background:#2e7d32; width:100%; padding:15px; font-weight:bold; font-size:1.2rem; color:white; border:none; border-radius:8px; cursor:pointer;">RETURN TO SCOREBOARD</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
